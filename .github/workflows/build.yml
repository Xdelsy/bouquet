name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyinstaller numpy

      - name: Build exe
        run: pyinstaller --onefile --windowed --name Bouquet bouquet.py

      - uses: actions/upload-artifact@v4
        with:
          name: Bouquet-windows
          path: dist/Bouquet.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyinstaller numpy

      - name: Build app
        run: pyinstaller --windowed --name Bouquet bouquet.py

      - name: Zip app
        run: cd dist && zip -r Bouquet-mac.zip Bouquet.app

      - uses: actions/upload-artifact@v4
        with:
          name: Bouquet-mac
          path: dist/Bouquet-mac.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Bouquet-windows/Bouquet.exe
            artifacts/Bouquet-mac/Bouquet-mac.zip
